name: Nightly pgvector Benchmark

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-pgvector-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pgvector-benchmark:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Check benchmark configuration
        id: benchmark-config
        run: |
          if [ -z "${{ secrets.PGVECTOR_BENCH_DSN }}" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "PGVECTOR_BENCH_DSN is not configured; skipping nightly benchmark run."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.benchmark-config.outputs.enabled == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[persistence]"

      - name: Run ADR-006 pgvector latency gate
        if: steps.benchmark-config.outputs.enabled == 'true'
        env:
          PG_DSN: ${{ secrets.PGVECTOR_BENCH_DSN }}
        run: |
          python scripts/bench/pgvector_recall.py \
            --dsn "$PG_DSN" \
            --source-type benchmark \
            --required-rows 1000000 \
            --query-count 200 \
            --warmup-count 20 \
            --ef-search 100 \
            --target-p95-ms 250

      - name: Benchmark skipped
        if: steps.benchmark-config.outputs.enabled != 'true'
        run: echo "Nightly pgvector benchmark skipped because PGVECTOR_BENCH_DSN is not configured."
