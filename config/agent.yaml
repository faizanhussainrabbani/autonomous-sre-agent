# SRE Agent Configuration
# See: src/sre_agent/config/settings.py for all options

telemetry_provider: otel  # "otel" or "newrelic"
cloud_provider: none      # "aws", "azure", or "none"

# OTel backend URLs (used when telemetry_provider = "otel")
otel:
  prometheus_url: "http://prometheus:9090"
  jaeger_url: "http://jaeger:16686"
  loki_url: "http://loki:3100"
  otel_collector_url: "http://otel-collector:4317"

# New Relic config (used when telemetry_provider = "newrelic")
# newrelic:
#   account_id: "YOUR_ACCOUNT_ID"
#   api_key_secret_name: "newrelic-api-key"
#   region: "US"

# AWS config (used when cloud_provider = "aws")
# aws:
#   region: "us-east-1"
#   eks_cluster_name: "production"
#   s3_bucket: "sre-agent-audit-logs"
#   secrets_manager_prefix: "/sre-agent/"

# CloudWatch telemetry config (used when features.cloudwatch_adapter = true)
# cloudwatch:
#   region: "eu-west-3"
#   metric_poll_interval_seconds: 60
#   log_fetch_window_minutes: 30
#   log_filter_pattern: "ERROR"
#   metric_streams_enabled: false
#   endpoint_url: null              # Set to LocalStack URL for local dev

# Bridge enrichment config (used when features.bridge_enrichment = true)
# enrichment:
#   fetch_metrics: true
#   fetch_logs: true
#   fetch_traces: false
#   fetch_resource_metadata: true

# AWS Health events polling
# aws_health:
#   enabled: false
#   poll_interval_seconds: 300
#   regions:
#     - "eu-west-3"

# Azure config (used when cloud_provider = "azure")
# azure:
#   subscription_id: "YOUR_SUBSCRIPTION_ID"
#   resource_group: "sre-agent-rg"
#   aks_cluster_name: "production"
#   blob_container: "audit-logs"
#   keyvault_name: "sre-agent-kv"

# Persistence config
persistence:
  enabled: true
  postgres_dsn: "postgresql://sre_agent:sre_agent@localhost:5432/sre_agent"
  pool_min_size: 2
  pool_max_size: 10

# Optional Redis-backed runtimes (defaults remain in-memory until switched)
# lock:
#   backend: in_memory          # in_memory | redis | etcd
#   redis_url: "redis://localhost:6379/0"
# event_bus:
#   backend: in_memory          # in_memory | redis_streams
#   redis_url: "redis://localhost:6379/0"

# Optional retention executor (app-level cleanup for dedup/snapshot tables)
# retention:
#   enabled: false
#   poll_interval_s: 3600
#   processed_events_retention_days: 30
#   baseline_snapshots_retention_days: 90

# Anomaly detection thresholds
detection:
  latency_sigma_threshold: 3.0
  latency_duration_minutes: 2
  error_rate_surge_percent: 200.0
  memory_pressure_percent: 85.0
  memory_pressure_duration_minutes: 5
  disk_exhaustion_percent: 80.0
  disk_projection_hours: 24
  cert_expiry_warning_days: 14
  cert_expiry_critical_days: 3
  deployment_correlation_window_minutes: 60
  suppression_window_seconds: 30
  # Phase 2.5: Slow response and timeout proximity thresholds
  slow_response_absolute_threshold_ms: 2000.0
  slow_response_duration_seconds: 60
  timeout_proximity_percent: 80.0

# Performance SLO targets
performance:
  alert_latency_seconds: 60
  error_alert_latency_seconds: 30
  proactive_alert_latency_seconds: 120
  rag_query_timeout_seconds: 30
  max_concurrent_rag_queries: 10
  max_concurrent_remediations: 3

# Feature flags
features:
  ebpf_enabled: true
  multi_dimensional_correlation: true
  deployment_aware_detection: true
  proactive_scaling: false
  architectural_recommendations: false
  new_relic_adapter: false
  otel_adapter: true
  cloudwatch_adapter: false
  bridge_enrichment: true
  background_polling: false
  eventbridge_integration: false
  aws_health_polling: false
  xray_adapter: false

log_level: INFO
environment: development
